apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-app-deployment
spec:
  replicas: 0 #to avoid pipeline to run continuously
  selector:
    matchLabels:
      app: weather-app
  template:
    metadata:
      labels:
        app: weather-app
    spec:
      containers:
      - name: weather-app
        image: omjaju18/weather-app:v20260117141819
        ports:
        - containerPort: 5000
